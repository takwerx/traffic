# Dependabot version updates (ops #1014). Keeps the pinned GitHub Actions in .github/workflows
# current: weekly, grouped into one PR, at most 3 open. Major versions are ignored on purpose: a
# major bump gets its own ops issue and a test instead of an automatic PR. Security updates are a
# separate repo setting and are not limited by this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

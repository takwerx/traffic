
// A typst already on PATH is preferred over downloading one. That removes a
// ~30 MB network fetch from the middle of the build, which is the only step
// here whose success varies from one run to the next on a shared builder.
def typstOnPath = {
    (System.getenv("PATH") ?: "").split(File.pathSeparator)
            .collect { new File(it, "typst") }
            .find { it.isFile() && it.canExecute() }
}

task setupTypst {
    group = "typst"
    description = "Downloads the pinned Typst binary, unless one is on PATH."

    def typstUrl = "https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz"
    def downloadDir = file("${buildDir}/typst")
    def tarFile = file("${downloadDir}/typst.tar.xz")
    def extractDir = file("${downloadDir}/extracted")
    def binary = file("${extractDir}/typst-x86_64-unknown-linux-musl/typst")

    inputs.property("typstUrl", typstUrl)
    outputs.dir(extractDir)

    doLast {
        def onPath = typstOnPath()
        if (onPath != null) {
            println "typst already on PATH (${onPath.absolutePath}), not downloading"
            extractDir.mkdirs()
            return
        }
        if (binary.isFile()) {
            // Already downloaded and extracted.
            return
        }

        downloadDir.mkdirs()
        extractDir.mkdirs()

        // -f so that an HTTP error is an error. Without it curl writes the
        // error body into the tarball and still exits 0, and the build then
        // fails at tar with "Extraction failed", which says nothing about the
        // network and is why a failed build here reports no useful reason.
        // --retry because this is a shared builder pulling 30 MB from GitHub
        // once per ATAK target, and a transient failure there is not a reason
        // to fail a submission.
        def cmd = ["curl", "-fsSL", "--retry", "5", "--retry-delay", "2",
                   "--retry-all-errors", "--connect-timeout", "30",
                   typstUrl, "-o", tarFile.absolutePath]
        println "Executing: ${cmd.join(' ')}"
        def dl = cmd.execute()
        // Drain the streams. The stock task called waitFor() without reading
        // them, so curl could fill the pipe buffer and block forever.
        dl.waitForProcessOutput(System.out, System.err)
        if (dl.exitValue() != 0) {
            throw new GradleException("Could not download typst from ${typstUrl}"
                    + " (curl exit ${dl.exitValue()}). The user manual cannot be"
                    + " built without it.")
        }
        if (!tarFile.isFile() || tarFile.length() < 1024 * 1024) {
            throw new GradleException("The typst download is too small to be the"
                    + " release tarball (${tarFile.length()} bytes). The server"
                    + " answered with something other than the archive.")
        }

        def ex = ["tar", "-xf", tarFile.absolutePath, "-C",
                  extractDir.absolutePath].execute()
        ex.waitForProcessOutput(System.out, System.err)
        if (ex.exitValue() != 0) {
            throw new GradleException("Could not extract ${tarFile}"
                    + " (tar exit ${ex.exitValue()}).")
        }
        if (!binary.isFile()) {
            throw new GradleException("typst extracted but ${binary} is missing;"
                    + " the archive layout is not what was expected.")
        }
        binary.setExecutable(true)
        tarFile.delete()
    }
}

task runTypst(dependsOn: setupTypst) {
    group = "typst"
    description = "Runs the Typst executable with the first .typ file (excluding formatting.typ)."

    // Constants, adjust as needed on a per-project basis
    def srcDir = file("$rootDir/docs/user_manual")
    def extractDir = file("$rootDir/app/build/typst/extracted/typst-x86_64-unknown-linux-musl")
    def assetsDir = file("$rootDir/app/src/main/assets")

    doLast {
        ///// Load the project version
        def pluginVersion = PLUGIN_VERSION

        ///// Load the platform version.
        Properties properties = new Properties()
        try {
            properties.load(new FileInputStream(rootProject.file('gradle.properties')))
        } catch (IOException e) {
            // Failed to read from local.properties, handle the exception if needed
        }

        def platformVersion = ATAK_VERSION

        // Find the first *.typ file excluding formatting.typ
        def typFiles = fileTree(srcDir)
                .include('**/*.typ')
                .exclude('**/formatting.typ')

        
        if (typFiles.isEmpty()) {
            println "Warning: No *.typ file found in $srcDir, will not build a user manual"
            return
        }

        def typFile = typFiles.first()

        // Replace platform-version and plugin-version
        def fileContent = typFile.text
        fileContent = fileContent.replaceAll(/platform-version: ".*?"/, "platform-version: \"$platformVersion\"")
        fileContent = fileContent.replaceAll(/plugin-version: ".*?"/, "plugin-version: \"$pluginVersion\"")

        // Write the modified content back to the file
        typFile.text = fileContent

        // Prefer a typst already on PATH. The stock check was
        // `new File('typst').exists()`, a RELATIVE path that is essentially
        // never there, so it always fell through to the downloaded binary --
        // which is linux-musl and cannot run on a developer's Mac. That made
        // the manual unbuildable outside tak.gov, which is how a plugin once
        // shipped a manual nobody could open.
        def typstExecutable = "${extractDir}/typst"
        def onPath = typstOnPath()
        if (onPath != null) {
            typstExecutable = onPath.absolutePath
            println "using typst from PATH: ${typstExecutable}"
        }

        // Run the typst compile command
        def typstCommand = [
                "${typstExecutable}", "compile",
                "--root", "$rootDir",
                "--font-path", "$srcDir",
                "${typFile.absolutePath}",
                "${assetsDir.absolutePath}/usermanual.pdf"
        ]
        println "Running command: $typstCommand"
        def process = typstCommand.execute()

        process.waitForProcessOutput(System.out, System.err)
        if (process.exitValue() != 0) {
            throw new GradleException("Error: typst command failed with exit code ${process.exitValue()}")
        }
    }
}

// Runs by default on the official ATAK release pipeline, and on demand locally
// with -PbuildManual (or BUILD_MANUAL=1). Local opt-in exists so the manual can
// be put on a device and opened BEFORE a submission rather than after: it is
// the only way to find out that a manual is unreachable, which is not visible
// by unzipping the APK.
def wantManual = System.getenv("ATAK_CI") == "1" ||
        System.getenv("BUILD_MANUAL") == "1" ||
        project.hasProperty("buildManual")

if (wantManual) {
    println("running typst to generate the user manual");
    android.applicationVariants.all { variant ->
        variant.mergeResourcesProvider.configure {
            dependsOn runTypst
        }
    }
} else {
    println("skipping user manual generation (use -PbuildManual to include it)");
}

